    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blueprint: {
                            dark: '#1e3a5f',
                            DEFAULT: '#2a5b8f', // Main blueprint blue
                            light: '#4285f4',
                            grid: 'rgba(255, 255, 255, 0.15)'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Space Mono', 'monospace'],
                    },
                    backgroundImage: {
                        'blueprint-grid': `
                            linear-gradient(rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.15) 1px, transparent 1px),
                            linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px)
                        `,
                    },
                    backgroundSize: {
                        'blueprint-grid': '100px 100px, 100px 100px, 20px 20px, 20px 20px',

            }

    <style>
        body {
            background-color: #2a5b8f; /* Blueprint base blue */
            color: #ffffff;
        }
        
        /* The grid overlay */
        .bg-grid {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.2) 1px, transparent 1px),
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 100px 100px, 100px 100px, 20px 20px, 20px 20px;
            background-position: center top;
        }

        /* Technical borders */
        .tech-border {
            border: 2px solid #ffffff;
            position: relative;
        }
        .tech-border::before, .tech-border::after,
        .tech-border .corner-tl, .tech-border .corner-br {
            content: '';
            position: absolute;
            width: 8px;
            height: 8px;
            border: 2px solid #ffffff;
        }
        .tech-border::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .tech-border::after { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .tech-border .corner-tl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .tech-border .corner-br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e3a5f; }
        ::-webkit-scrollbar-thumb { background: #ffffff; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

        /* Filter Buttons */
        .filter-btn {
            transition: all 0.3s ease;
        }
        .filter-btn.active {
            background-color: #ffffff;
            color: #2a5b8f;
            font-weight: bold;
        }

        /* Project Card Hover */
        .project-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .project-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }

        /* Blueprint measurements decoration */
        .measurement {
            position: absolute;
            font-family: 'Space Mono', monospace;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.6);
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

                },
                // 2D Projects
                {
                    id: "shadow-realm",
                    category: "2d",

                    shortDesc: "2D platformer with unique light and shadow mechanics.",

                },
                {
                    id: "archerun",
                    category: "other",
                    title: "Archerun",
                    thumbnail: "assets/images/archeorun.png",
                    links: {  github: "https://github.com/emadrigalv/MiniJam149Ancient",
                        play: "https://mangelhoyos.itch.io/archeorun" }
                },
                {
                    id: "death-hunting",
                    category: "other",
                    title: "Death Hunting Survivor",
                    thumbnail: "assets/images/dhs.png",
                    links: {  github: "https://lazyface.itch.io/death-hunting-survival",
                            play: "https://github.com/LazyFace/BH_TestGame" }

                    id: "bubble-ernie",
                    category: "other",
                    title: "Bubble Ernie",
                    thumbnail: "assets/images/bubble.png",

                            play: "https://offsetdev.itch.io/bubble-ernie" }
                }
            ]
        };

        const contentArea = document.getElementById('content-area');
        const modal = document.getElementById('project-modal');
        const modalContent = document.getElementById('modal-content');
        const closeModalBtn = document.getElementById('close-modal');

        // Render Home Section
        function renderHome() {
            const data = portfolioData.home;
            contentArea.innerHTML = `
                <div class="fade-in grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-2 tech-border p-6 md:p-8 bg-blueprint-dark/30 rounded-xl relative">
                        <div class="corner-tl"></div><div class="corner-br"></div>
                        <h2 class="text-3xl font-mono font-bold mb-4 border-b border-white/20 pb-2 flex items-center gap-2">

                                <span class="break-all text-sm md:text-base">${data.contact.email}</span>
                            </li>
                            <li class="flex items-center gap-3">
                                <i class="fa-solid fa-phone text-xl text-blue-300"></i> 
                                <span class="text-sm md:text-base">${data.contact.phone}</span>
                            </li>
                            <li class="flex items-center gap-3">
                                <i class="fa-solid fa-location-dot text-xl text-blue-300"></i> 
                                <span class="text-sm md:text-base">${data.contact.location}</span>
                            </li>
                        </ul>
                        <div class="mt-8 pt-4 border-t border-white/20">
                            <p class="text-xs text-white/50 mb-2 font-mono">QUICK LINKS</p>
                            <div class="flex flex-col gap-2">
                                <a href="assets/CV-EmmanuelMadrigal-UD-2026.pdf" download="CV-EmmanuelMadrigal.pdf" target="_blank" class="block text-center py-2 border border-white/50 rounded hover:bg-white hover:text-blueprint transition font-mono uppercase text-sm font-bold">
                                    <i class="fa-solid fa-file-arrow-down mr-2"></i> Download Resume
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Render Project Gallery
        function renderGallery(category) {
            const projects = portfolioData.projects.filter(p => p.category === category);
            
            if (projects.length === 0) {
                contentArea.innerHTML = `<div class="fade-in text-center font-mono py-20 text-xl border border-dashed border-white/30 rounded-lg">NO DATA FOUND FOR CATEGORY: ${category.toUpperCase()}</div>`;
                return;
            }
        
            let html = `<div class="fade-in grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">`;
            
            projects.forEach(project => {
                if(category === 'other') {
                    html += `
                        <div class="project-card tech-border bg-blueprint-dark/40 rounded-lg overflow-hidden group cursor-pointer relative">
                            <div class="corner-tl"></div><div class="corner-br"></div>
                            <img src="${project.thumbnail}" alt="${project.title}" class="w-full aspect-square object-cover transition-opacity">
                            <div class="absolute bottom-0 w-full bg-blueprint-dark/90 p-3 text-center border-t border-white/20">
                                <h3 class="font-mono font-bold text-lg">${project.title}</h3>
                                <div class="mt-2 flex justify-center gap-3">
                                    ${project.links.play ? `<a href="${project.links.play}" target="_blank" class="text-sm hover:text-blue-300"><i class="fa-solid fa-gamepad"></i> Play</a>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    html += `
                        <div class="project-card tech-border bg-blueprint-dark/40 flex flex-col rounded-lg overflow-hidden group relative">
                            <div class="corner-tl"></div><div class="corner-br"></div>
                            <div class="relative overflow-hidden aspect-video border-b border-white/20">
                                <img src="${project.thumbnail}" alt="${project.title}" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-500">
                                <div class="absolute top-2 right-2 text-xs font-mono bg-blueprint-dark/80 px-2 py-1 border border-white/30 rounded">
                                    [OBJ_${project.id.substring(0,4).toUpperCase()}]
                                </div>
                            </div>
                            <div class="p-5 flex-grow flex flex-col">
                                <h3 class="font-mono font-bold text-xl mb-2">${project.title}</h3>
                                <p class="text-sm text-blue-100 mb-4 flex-grow line-clamp-3">${project.shortDesc}</p>
                                <button onclick="openModal('${project.id}')" class="mt-auto w-full py-2 border border-white rounded font-mono text-sm uppercase hover:bg-white hover:text-blueprint transition-colors font-bold tracking-widest">
                                    <i class="fa-solid fa-magnifying-glass mr-2"></i> Inspect Data
                                </button>
                            </div>
                        </div>
                    `;
                }
            });
            
            html += `</div>`;
            contentArea.innerHTML = html;
        }
        
        function openModal(projectId) {
            const project = portfolioData.projects.find(p => p.id === projectId);
            if (!project) return;
        
            let mediaHtml = '';
            if (project.mediaType === 'video') {
                if (project.mediaSrc.endsWith(".mp4") || project.mediaSrc.includes("assets/")) {
                    mediaHtml = `
                        <video controls width="100%" class="rounded border border-white/40 shadow-lg">
                            <source src="${project.mediaSrc}" type="video/mp4">
                            Your browser does not support the video tag.
                        </video>
                    `;
                } else {
                    mediaHtml = `
                        <div class="relative w-full aspect-video">
                            <iframe src="${project.mediaSrc}" width="100%" height="100%" frameborder="0" allowfullscreen class="rounded border border-white/40"></iframe>
                        </div>
                    `;
                }
            } else {
                mediaHtml = `<img src="${project.thumbnail}" alt="${project.title}" class="w-full rounded border border-white/40 object-cover">`;
            }
        
            let tasksHtml = '';
            if (project.tasks && project.tasks.length > 0) {
                tasksHtml = `
                    <h4 class="font-mono font-bold text-lg mb-2 mt-6 flex items-center gap-2 border-b border-white/20 pb-1">
                        <i class="fa-solid fa-list-check"></i> Executed Tasks
                    </h4>
                    <ul class="list-none space-y-2 mb-6 font-sans text-sm">
                        ${project.tasks.map(task => `
                            <li class="flex items-start">
                                <span class="mr-2 text-blue-300 font-mono">></span>
                                <span>${task}</span>
                            </li>
                        `).join('')}
                    </ul>
                `;
            }
        
            let linksHtml = '<div class="flex flex-wrap gap-4 mt-8 pt-4 border-t border-white/20">';
            if (project.links && project.links.github) {
                linksHtml += `<a href="${project.links.github}" target="_blank" class="px-6 py-2 border border-white rounded font-mono hover:bg-white hover:text-blueprint transition-colors font-bold">
                                <i class="fa-brands fa-github mr-2"></i> Repository
                              </a>`;
            }
            if (project.links && project.links.play && project.links.play !== '#') {
                linksHtml += `<a href="${project.links.play}" target="_blank" class="px-6 py-2 border border-white rounded font-mono hover:bg-white hover:text-blueprint transition-colors font-bold bg-white/10">
                                <i class="fa-solid fa-gamepad mr-2"></i> Play / View
                              </a>`;
            }
            linksHtml += '</div>';
        
            modalContent.innerHTML = `
                <div class="grid grid-cols-1 lg:grid-cols-5 gap-8">
                    <div class="lg:col-span-3">
                        ${mediaHtml}
                    </div>
                    <div class="lg:col-span-2 flex flex-col justify-center">
                        <div class="inline-block bg-white/10 px-2 py-1 text-xs font-mono border border-white/30 rounded w-max mb-3">CLASS: ${project.category.toUpperCase()}</div>
                        <h2 class="text-3xl md:text-4xl font-mono font-bold mb-4 uppercase">${project.title}</h2>
                        
                        <h4 class="font-mono font-bold text-lg mb-2 flex items-center gap-2 border-b border-white/20 pb-1">
                            <i class="fa-solid fa-file-lines"></i> Project Overview
                        </h4>
                        <p class="text-base leading-relaxed mb-4">${project.description}</p>
                        
                        ${tasksHtml}
                        ${linksHtml}
                    </div>
                </div>
            `;
            
            modal.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        // Close Modal
        closeModalBtn.addEventListener('click', () => {
            modal.classList.add('hidden');
            document.body.style.overflow = 'auto';
            modalContent.innerHTML = ''; // Stop video playback
        });

        // Close modal on outside click
        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.add('hidden');
                document.body.style.overflow = 'auto';
                modalContent.innerHTML = '';
            }
        });

        // Utilities
        function copyToClipboard(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                // Simple visual feedback could be added here
            } catch (err) {
                console.error('Failed to copy text', err);
            }
            document.body.removeChild(textarea);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.filter-btn');
            
            // Initial render
            renderHome();

            buttons.forEach(btn => {
                btn.addEventListener('click', (e) => {
                    // Update active state
                    buttons.forEach(b => b.classList.remove('active', 'bg-white', 'text-blueprint', 'font-bold'));
                    btn.classList.add('active');
                    
                    const filter = btn.getAttribute('data-filter');
                    
                    // Render content based on filter
                    if (filter === 'home') {
                        renderHome();
                    } else {
                        renderGallery(filter);
                    }
                });
            });
        });
    </script>
</body>
</html>
